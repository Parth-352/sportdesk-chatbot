<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportDesk - Event Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --color-primary: #0066CC;
      --color-bg-main: #FFFFFF;
      --color-bg-secondary: #F5F5F7;
      --color-accent-blue: #E8F2FF;
      --color-accent-green: #34C759;
      --color-text-primary: #1D1D1F;
      --color-text-secondary: #6E6E73;
      --color-border: #D2D2D7;
    }

    body {
      background-color: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D2D2D7;
      border-radius: 999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="p-3 sm:p-6 bg-[#F5F5F7] text-[#1D1D1F] min-h-screen flex items-center justify-center">

  <!-- Main Card Container -->
  <div class="w-full max-w-xl bg-[#FFFFFF] border border-[#D2D2D7] rounded-2xl shadow-sm overflow-hidden flex flex-col" style="height: 540px;">
    
    <!-- Minimal Header: Bot Icon + Name + Active Status -->
    <header class="px-4 py-3 bg-[#FFFFFF] border-b border-[#D2D2D7] flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-[#E8F2FF] border border-[#0066CC]/20 flex items-center justify-center text-[#0066CC]">
          <!-- Sleek Robot Icon -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
        </div>
        <div>
          <h1 class="font-semibold text-sm text-[#1D1D1F] tracking-tight leading-tight">SportDesk</h1>
          <p class="text-[11px] text-[#6E6E73] leading-none">Event Assistant</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 text-xs text-[#6E6E73]">
        <span class="w-2 h-2 rounded-full bg-[#34C759]"></span>
        <span class="text-[11px] font-medium">Active</span>
      </div>
    </header>

    <!-- Chat Stream -->
    <div class="flex-1 flex flex-col overflow-hidden bg-[#FFFFFF]">
      
      <!-- Messages List -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Initial Bot Message -->
        <div class="flex items-start gap-2 max-w-[85%]">
          <div class="w-6 h-6 rounded-full bg-[#F5F5F7] border border-[#D2D2D7] text-[#0066CC] flex-shrink-0 flex items-center justify-center mt-0.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <circle cx="12" cy="5" r="2"></circle>
              <path d="M12 7v4"></path>
              <line x1="8" y1="16" x2="8.01" y2="16"></line>
              <line x1="16" y1="16" x2="16.01" y2="16"></line>
            </svg>
          </div>
          <div class="bg-[#F5F5F7] text-[#1D1D1F] rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-xs sm:text-sm leading-relaxed whitespace-pre-line">
            Hi! I can help you with tournament schedules, venue navigation, delays, and event rules. What would you like to know?
          </div>
        </div>
      </div>

      <!-- BOTTOM SECTION: Text-only suggestions directly above input -->
      <div class="border-t border-[#D2D2D7] bg-[#FFFFFF] pt-2 pb-3 px-3 flex-shrink-0">
        
        <!-- Suggestions: Text Only, No Emojis/Icons -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2 text-xs">
          <button onclick="sendQuickPrompt('When is the 100m sprint final?')" class="px-3 py-1 bg-[#F5F5F7] hover:bg-[#E8F2FF] hover:text-[#0066CC] hover:border-[#0066CC]/30 text-[#1D1D1F] border border-[#D2D2D7] rounded-full whitespace-nowrap transition-all text-xs font-normal">
            100m Final
          </button>
          <button onclick="sendQuickPrompt('Where is the medical tent?')" class="px-3 py-1 bg-[#F5F5F7] hover:bg-[#E8F2FF] hover:text-[#0066CC] hover:border-[#0066CC]/30 text-[#1D1D1F] border border-[#D2D2D7] rounded-full whitespace-nowrap transition-all text-xs font-normal">
            Medical Tent
          </button>
          <button onclick="sendQuickPrompt('Is there any rain delay?')" class="px-3 py-1 bg-[#F5F5F7] hover:bg-[#E8F2FF] hover:text-[#0066CC] hover:border-[#0066CC]/30 text-[#1D1D1F] border border-[#D2D2D7] rounded-full whitespace-nowrap transition-all text-xs font-normal">
            Rain Delays
          </button>
          <button onclick="sendQuickPrompt('What are the spike shoe rules?')" class="px-3 py-1 bg-[#F5F5F7] hover:bg-[#E8F2FF] hover:text-[#0066CC] hover:border-[#0066CC]/30 text-[#1D1D1F] border border-[#D2D2D7] rounded-full whitespace-nowrap transition-all text-xs font-normal">
            Shoe Rules
          </button>
          <button onclick="sendQuickPrompt('Where can I park?')" class="px-3 py-1 bg-[#F5F5F7] hover:bg-[#E8F2FF] hover:text-[#0066CC] hover:border-[#0066CC]/30 text-[#1D1D1F] border border-[#D2D2D7] rounded-full whitespace-nowrap transition-all text-xs font-normal">
            Parking
          </button>
        </div>

        <!-- Clean Input Box with embedded Send Button -->
        <form id="chatForm" onsubmit="handleUserInput(event)" class="relative flex items-center">
          <input 
            type="text" 
            id="chatInput" 
            placeholder="Ask a question..." 
            class="w-full bg-[#F5F5F7] border border-[#D2D2D7] text-[#1D1D1F] placeholder-[#6E6E73] text-xs sm:text-sm rounded-xl pl-3.5 pr-10 py-2.5 focus:outline-none focus:ring-1 focus:ring-[#0066CC] focus:bg-[#FFFFFF] transition-all"
            autocomplete="off"
          />
          <button 
            type="submit" 
            id="sendBtn"
            class="absolute right-1.5 w-7 h-7 rounded-lg bg-[#0066CC] hover:bg-[#0055B3] active:bg-[#004799] text-white flex items-center justify-center transition-colors"
            title="Send"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
          </button>
        </form>

      </div>

    </div>

  </div>

  <script>
    function sendQuickPrompt(text) {
      document.getElementById('chatInput').value = text;
      handleUserInput(new Event('submit'));
    }

    async function handleUserInput(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chatInput');
      const query = input.value.trim();
      if (!query) return;

      appendUserMessage(query);
      input.value = '';

      // Typing indicator
      const typingId = appendTypingIndicator();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });
        const data = await response.json();
        removeTypingIndicator(typingId);
        appendBotMessage(data.response, data.source);
      } catch (err) {
        removeTypingIndicator(typingId);
        appendBotMessage("Connection to the event server was interrupted. Please retry in a moment.");
      }
    }

    function appendUserMessage(text) {
      const container = document.getElementById('messagesContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex justify-end';
      msgDiv.innerHTML = `
        <div class="max-w-[80%] bg-[#0066CC] text-white rounded-2xl rounded-tr-sm px-3.5 py-2 text-xs sm:text-sm leading-relaxed shadow-sm">
          ${escapeHtml(text)}
        </div>
      `;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function appendBotMessage(text, source) {
      const container = document.getElementById('messagesContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start gap-2 max-w-[85%]';
      msgDiv.innerHTML = `
        <div class="w-6 h-6 rounded-full bg-[#F5F5F7] border border-[#D2D2D7] text-[#0066CC] flex-shrink-0 flex items-center justify-center mt-0.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
        </div>
        <div>
          <div class="bg-[#F5F5F7] text-[#1D1D1F] rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-xs sm:text-sm leading-relaxed whitespace-pre-line">
            ${escapeHtml(text)}
          </div>
          ${source ? `<div class="text-[10px] text-[#6E6E73] mt-1 ml-1">${escapeHtml(source)}</div>` : ''}
        </div>
      `;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function appendTypingIndicator() {
      const container = document.getElementById('messagesContainer');
      const id = 'typing-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = 'flex items-start gap-2 max-w-[85%]';
      div.innerHTML = `
        <div class="w-6 h-6 rounded-full bg-[#F5F5F7] border border-[#D2D2D7] text-[#0066CC] flex-shrink-0 flex items-center justify-center mt-0.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
        </div>
        <div class="bg-[#F5F5F7] text-[#6E6E73] rounded-2xl rounded-tl-sm px-3 py-2 text-xs flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6E6E73] animate-pulse"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#6E6E73] animate-pulse" style="animation-delay: 200ms;"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#6E6E73] animate-pulse" style="animation-delay: 400ms;"></span>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
